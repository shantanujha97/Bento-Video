<style>
@font-face{font-family:Friends;src:url(fonts/Friends-SemiBold.ttf);font-weight:600}
@font-face{font-family:PJS;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:PJS;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:PJS;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#040505;font-family:Friends,sans-serif;color:#fff}
.abs{position:absolute;left:0;top:0}
canvas{position:absolute;left:0;top:0}
.world{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0;backface-visibility:hidden}
.world img{position:absolute;display:block}
.card{position:absolute;left:0;top:0;width:1440px;overflow:hidden;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.35),0 30px 80px rgba(0,0,0,.5)}
.glass{opacity:.5;position:absolute;left:-16px;top:-16px;width:1472px;border-radius:34px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.14) 100%);backdrop-filter:blur(20px) saturate(1.15) brightness(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.09),inset 0 0 18px rgba(255,255,255,.035),0 24px 60px rgba(0,0,0,.22)}
.glass::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.03) 26%,rgba(255,255,255,0) 36%)}
.glass::after{content:"";position:absolute;inset:0;background:radial-gradient(110% 55% at 18% 0%,rgba(34,237,78,.05),rgba(0,0,0,0) 60%),radial-gradient(80% 45% at 88% 100%,rgba(254,75,21,.04),rgba(0,0,0,0) 62%)}
.t{position:absolute;white-space:pre;font-family:PJS;font-weight:600}
.caret{display:inline-block;width:2px;background:#fff;margin-left:2px;vertical-align:top}
.sweep{position:absolute;overflow:hidden;display:none}
.sweep i{position:absolute;top:-20%;height:140%;width:110px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));transform:skewX(-20deg)}
.patch{position:absolute;background:#121212}
.head{position:absolute;left:0;width:1920px;text-align:center;font-weight:600;letter-spacing:-0.025em;transform-origin:960px 50%;will-change:transform}
.head span{display:inline-block;margin:0 .06em}
.head .gw + .gw{margin-left:.27em}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0%,#e6ffec 25%,#57ef80 55%,rgba(10,40,18,0) 100%);opacity:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.chip{position:absolute;background:rgba(255,255,255,.86);color:#0a0b0e;font-family:PJS;font-weight:600;border-radius:6px;white-space:nowrap;backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.6)}
.row,.bar{position:absolute}
.hov{position:absolute;opacity:0;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 12px 32px rgba(0,0,0,.35)}
.hovr{position:absolute;opacity:0;background:rgba(255,255,255,.04)}
.phone{position:absolute;width:318px;height:667px;border-radius:46px;padding:9px;box-sizing:border-box;background:linear-gradient(180deg,#1d1f1e,#0c0d0d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 30px 70px rgba(0,0,0,.55)}
.phone img{position:absolute;left:9px;top:9px;width:300px;height:649px;border-radius:37px;display:block}
.hdot{position:absolute;left:-3px;width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1.5px #1a1a1a}
#tip{border-radius:16px;background:#222324;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.45);overflow:hidden;font-family:PJS}
#tip .thead{height:30px;background:#252627;color:#777;font-size:12px;font-weight:500;line-height:30px;padding-left:14px}
#tip .trow{position:relative;height:24px;margin-top:5px;font-size:12px;line-height:24px}
#tip .trow b{position:absolute;left:12px;top:8.5px;width:7px;height:7px;border-radius:2px}
#tip .trow span{position:absolute;left:25px;color:#cfd0d0;font-weight:500}
#tip .trow em{position:absolute;right:12px;color:#fff;font-weight:600;font-style:normal}
.pct{position:absolute;width:280.8px;text-align:right;font-family:PJS;font-weight:600;font-size:16px;line-height:17px;color:#22ed4e;white-space:pre}
</style></head>
